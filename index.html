<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora-Dev</title>
</head>

<body>

<div class="container-every">

    <div class="container-calc">
   <input class="input-calc" type="text"  value="">
</div>

    <div class="container-topo">
        <button>Ac</button>
        <button>DEL</button>
        <button>%</button>
    </div>
    <div class="container-divisao">
        <button>/</button>
        <button>7</button>
        <button>8</button>
    </div>

    <div class="container-multiplicacao">
        <button>*</button>
        <button>4</button>
        <button>5</button>
    </div>

    <div class="container-six">
        <button>6</button>
        <button>-</button>
        <button>1</button>
    </div>

    <div class="container-two">
        <button>2</button>
        <button>3</button>
        <button>+</button>
    </div>
    <div class="container-zero">
        <button>0</button>
        <button>.</button>
        <button>=</button>
    </div>

    </div>
</body>

</html>
