<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora-Dev</title>
</head>

<body>

<div class="container-every">

    <div class="container-calc">
   <input class="input-calc" type="text"  value="">
</div>

    <div class="container-topo">
        <button id="button-ac">C</button>
        <button id="button-del">D</button>
        <button id="button-percent">%</button>
    </div>
    <div class="container-divisao">
        <button id="button-division">/</button>
        <button id="button-seven">7</button>
        <button id="button-eight">8</button>
    </div>

    <div class="container-multiplicacao">
        <button id="button-multi">*</button>
        <button id="button-four">4</button>
        <button id="button-five">5</button>
    </div>

    <div class="container-six">
        <button id="button-six">6</button>
        <button id="button-subtract">-</button>
        <button id="button-one">1</button>
    </div>

    <div class="container-two">
        <button id="button-two">2</button>
        <button id="button-tree">3</button>
        <button id="button-more">+</button>
    </div>
    <div class="container-zero">
        <button id="button-zero">0</button>
        <button id="ponto">.</button>
        <button id="igual">=</button>
    </div>

    </div>
</body>

</html>
